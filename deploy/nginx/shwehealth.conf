# Nginx reverse proxy for the EC2 deployment.
# Copy to /etc/nginx/sites-available/shwehealth.conf and symlink into sites-enabled.
# Certbot adds the HTTPS (443) blocks and redirects to these server blocks.

# Admin web — shwehealth.com (PM2 "lab-admin-web" on port 4173)
server {
    listen 80;
    listen [::]:80;
    server_name shwehealth.com www.shwehealth.com;

    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Backend API — api.shwehealth.com (PM2 "lab-backend" on port 3000)
server {
    listen 80;
    listen [::]:80;
    server_name api.shwehealth.com;

    # Result PDFs, banners and profile images are uploaded through the API.
    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # AI review and route planning calls can take a while.
        proxy_read_timeout 120s;
    }
}
